name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --reporter expanded

  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm install --no-audit --no-fund

      - name: Run rules tests against the Firestore emulator
        run: >-
          firestore-tests/node_modules/.bin/firebase emulators:exec
          --only firestore --project demo-atelier
          "npm --prefix firestore-tests test"
