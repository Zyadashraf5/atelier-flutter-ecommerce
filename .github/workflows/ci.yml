name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --reporter expanded

      - name: Compile web showcase (example configuration only)
        run: flutter build web --dart-define-from-file=firebase.env.example.json

  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm ci --no-audit --no-fund

      - name: Install trusted checkout dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Trusted checkout unit tests
        run: npm --prefix functions test

      - name: Run security and transaction tests against emulators
        run: >-
          firestore-tests/node_modules/.bin/firebase emulators:exec
          --only auth,firestore,functions --project demo-atelier
          "npm --prefix functions run test:integration && npm --prefix firestore-tests test"

  android:
    name: Android debug compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Compile unsigned debug app with example configuration
        run: flutter build apk --debug --dart-define-from-file=firebase.env.example.json
