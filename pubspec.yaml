name: mine_ecommerce
description: "Atelier: a Flutter e-commerce app for a home-decor store. Firebase Auth, Cloud Firestore, GetX, feature-first structure."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cloud_functions: ^6.0.0
  cloud_firestore: ^6.0.2
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  get: ^4.6.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3

dev_dependencies:
  firebase_core_platform_interface: ^6.0.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
